# Zepp — ARUN Bot Nginx Config
# File: /etc/nginx/sites-available/zepp
# Symlink: ln -s /etc/nginx/sites-available/zepp /etc/nginx/sites-enabled/zepp
#
# This is a SEPARATE file from any existing nginx configs.
# It adds Zepp on port 8001 proxied through nginx at /zepp/
# so you can access it via http://76.13.179.32/zepp/
#
# ALTERNATIVE: If you prefer direct port access (http://76.13.179.32:8001),
# skip this file entirely and just open port 8001 in the firewall.

server {
    listen 80;
    server_name 76.13.179.32;   # Replace with your domain if you add one later

    # Zepp Web Dashboard — accessible at /zepp/
    location /zepp/ {
        proxy_pass         http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30;
    }

    # --- DO NOT ADD anything else here ---
    # Your other projects have their own server blocks.
    # This block only handles /zepp/ — everything else falls through to other configs.
}
