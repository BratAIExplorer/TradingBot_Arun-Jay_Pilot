# TradingBot — Nginx config (OPTIONAL)
# File: /etc/nginx/sites-available/tradingbot
# Symlink: ln -s /etc/nginx/sites-available/tradingbot /etc/nginx/sites-enabled/tradingbot
#
# Skip this file entirely if direct IP:port access is fine — just open port 8001
# in the firewall and browse to http://<VPS_IP>:8001. Use this only if you want
# the dashboard reachable at http://<VPS_IP>/tradingbot/ instead.

server {
    listen 80;
    server_name _;   # replace with a domain if you add one later

    location /tradingbot/ {
        proxy_pass         http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30;
    }

    # DO NOT add anything else here — other projects on this VPS keep their own
    # server blocks; this one only handles /tradingbot/.
}
